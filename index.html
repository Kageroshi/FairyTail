<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#120d20">
  <title>Fairy Tail</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="wrap">
    <header>
      <img src="emblem.png" alt="Fairy Tail Emblem" class="guild-emblem">
      <h1>FAIRY TAIL</h1>
    </header>

    <section class="quote" aria-label="Guild motto">
      <p>Power of Friendship Conquers All</p>
    </section>

    <section aria-labelledby="members-title">
      <div class="section-heading">
        <h2 id="members-title">S-Class Members</h2>
      </div>

      <div class="members">

        <article class="member laxus">
          <div class="sigil" aria-label="Lightining emblem">
            <svg viewBox="0 0 80 80" fill="none" aria-hidden="true">
              <path d="M46 5 L19 43 H36 L29 75 L62 32 H43 L46 5Z" fill="currentColor" stroke="#fff0c7" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </div>
          <h3>Laxus</h3>
          <div class="role">Leader</div>
          <p class="trait">“Ikaw lang sapat na <3“</p>
        </article>

        <article class="member yvaine">
          <div class="sigil" aria-label="Ice emblem">
            <svg viewBox="0 0 80 80" fill="none" aria-hidden="true">
              <path d="M40 7 V73 M11 23 L69 57 M11 57 L69 23" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
              <path d="M40 7 L32 17 M40 7 L48 17 M40 73 L32 63 M40 73 L48 63 M11 23 L24 24 M11 23 L16 35 M69 57 L56 56 M69 57 L64 45 M11 57 L24 56 M11 57 L16 45 M69 23 L56 24 M69 23 L64 35" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            </svg>
          </div>
          <h3>Heiress Yvaine</h3>
          <div class="role">Co-Leader</div>
          <p class="trait">“Gwapo kaba?“</p>
        </article>

        <article class="member scorpio">
          <div class="sigil" aria-label="Flame emblem">
            <svg viewBox="0 0 80 80" fill="none" aria-hidden="true">
              <path d="M42 6 C46 22 28 26 32 41 C24 37 23 31 25 25 C12 38 14 57 28 67 C42 78 62 68 64 52 C66 39 56 29 53 22 C52 35 46 37 43 34 C38 29 48 17 42 6Z" fill="currentColor"/>
              <path d="M42 43 C45 52 36 54 39 63 C30 61 29 52 34 47 C35 54 40 53 42 43Z" fill="#fff0c7"/>
            </svg>
          </div>
          <h3>Scorpio_05</h3>
          <div class="role">Co-Leader</div>
          <p class="trait">“Fonso For life!“</p>
        </article>
      </div>
    </section>

<section class="music-section">
    <div class="music-list">
        <div class="music-card">
            <audio class="bgMusic" src="ft1.mp3" loop></audio>
            <button class="music-button">♫ Play Music</button>
        </div>

        <div class="music-card">
            <audio class="bgMusic" src="ft2.mp3" loop></audio>
            <button class="music-button">♫ Play Music</button>
        </div>

        <div class="music-card">
            <audio class="bgMusic" src="ft3.mp3" loop></audio>
            <button class="music-button">♫ Play Music</button>
        </div>
    </div>
</section>

<section class="highlights-section">
    <h2>Highlights</h2>

    <div class="highlights-grid" id="highlightsGrid">
        <p>Loading highlights...</p>
    </div>
</section>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">x</button>
    <div class="lightbox-content" id="lightboxContent"></div>
</div>

<div class="copy-container">
    <button class="copy-button" data-copy="#2QUP899CJ">
        ⧉ Clan Tag #2QUP899CJ
    </button>
</div>

    <footer><h2>Join us and be part of Fairy Tail</h2></footer>
  </main>
</body>
</html>
