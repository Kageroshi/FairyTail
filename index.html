<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#120d20">
  <title>Fairy Tail</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  
  <audio id="bgMusic" autoplay loop>
    <source src="ft.mp3" type="audio/mpeg">
  </audio>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap');

    :root {
      --ink: #f8f3ff;
      --muted: #c8bbd8;
      --gold: #f5c66b;
      --panel: rgba(29, 19, 43, .78);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .wrap { width: min(1080px, 92%); margin: auto; position: relative; }
    header { text-align: center; padding: 76px 0 52px; }
    .guild-mark {
      width: 112px; height: 112px; margin: 0 auto 22px;
      display: grid; place-items: center;
      border: 2px solid rgba(245,198,107,.8);
      border-radius: 32px 32px 32px 8px;
      transform: rotate(-8deg);
      background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.02));
      box-shadow: 0 0 45px rgba(235, 148, 75, .22), inset 0 0 24px rgba(255,255,255,.06);
    }
    .guild-mark svg { width: 76px; height: 76px; transform: rotate(8deg); }
    .eyebrow {
      color: var(--gold); letter-spacing: .38em; text-transform: uppercase;
      font-size: .72rem; font-weight: 700; margin-bottom: 12px;
    }
    h1 {
      font-family: 'Cinzel', serif; font-size: clamp(2.8rem, 8vw, 5.8rem);
      line-height: 1; margin: 0; letter-spacing: .04em;
      text-shadow: 0 5px 30px rgba(230, 137, 83, .28);
    }
    .subtitle { color: var(--muted); margin: 18px 0 0; letter-spacing: .18em; text-transform: uppercase; font-size: .78rem; }

    .quote {
      max-width: 760px; margin: 0 auto 76px; padding: 30px 24px;
      text-align: center; position: relative;
      border-top: 1px solid rgba(245,198,107,.45);
      border-bottom: 1px solid rgba(245,198,107,.45);
    }
    .quote::before, .quote::after { color: var(--gold); font-family: Georgia, serif; font-size: 3rem; position: absolute; opacity: .8; }
    .quote::before { content: "“"; left: 4px; top: 7px; }
    .quote::after { content: "”"; right: 4px; bottom: -15px; }
    .quote p { font-family: 'Cinzel', serif; font-size: clamp(1.3rem, 4vw, 2rem); margin: 0; }
    .quote small { display: block; color: var(--muted); margin-top: 12px; letter-spacing: .22em; text-transform: uppercase; font-size: .65rem; }

    .section-heading { text-align: center; margin-bottom: 28px; }
    .section-heading h2 { font: 700 clamp(1.7rem, 4vw, 2.4rem) 'Cinzel', serif; margin: 0 0 9px; }
    .section-heading p { color: var(--muted); margin: 0; font-size: .9rem; }

    .members {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px;
      padding-bottom: 76px;
    }
    .member {
      position: relative; overflow: hidden; text-align: center;
      padding: 30px 22px 28px; border-radius: 18px;
      background: var(--panel); border: 1px solid rgba(255,255,255,.11);
      box-shadow: 0 18px 45px rgba(0,0,0,.2);
      transition: transform .25s ease, border-color .25s ease;
    }
    .member:hover { transform: translateY(-8px); border-color: rgba(245,198,107,.65); }
    .member::before {
      content: ""; position: absolute; width: 190px; height: 190px; border-radius: 50%;
      top: -120px; left: calc(50% - 95px); background: var(--glow); filter: blur(45px); opacity: .3;
    }
    .sigil {
      width: 126px; height: 126px; margin: 0 auto 20px; position: relative;
      display: grid; place-items: center; border-radius: 50%;
      background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.025));
      border: 1px solid color-mix(in srgb, var(--accent), transparent 35%);
      box-shadow: 0 0 30px color-mix(in srgb, var(--accent), transparent 78%), inset 0 0 22px rgba(255,255,255,.06);
    }
    .sigil svg { width: 68px; height: 68px; color: var(--accent); }
    .member h3 { font: 700 1.45rem 'Cinzel', serif; margin: 0 0 7px; }
    .member .role { color: var(--accent); font-size: .68rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    .member .trait { color: var(--muted); font-size: .84rem; line-height: 1.6; margin: 15px 0 0; }
    .laxus { --accent: #e1ff00; --glow: #fffb00; }
    .yvaine { --accent: #8bd5f5; --glow: #399bd1; }
    .scorpio { --accent: #ff765d; --glow: #ef493c; }

    footer { text-align: center; padding: 0 0 30px; color: #9d8eae; font-size: .72rem; letter-spacing: .08em; }
    footer span { color: var(--gold); }
    @media (max-width: 700px) {
      header { padding-top: 54px; }
      .members { grid-template-columns: 1fr; max-width: 420px; margin: auto; }
      .quote { margin-bottom: 58px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>FAIRY TAIL</h1>
    </header>

    <section class="quote" aria-label="Guild motto">
      <p>Power of Friendship For The Win</p>
    </section>

    <section aria-labelledby="members-title">
      <div class="section-heading">
        <h2 id="members-title">S-Class Members</h2>
      </div>

      <div class="members">
        <article class="member laxus">
          <div class="sigil" aria-label="Lightining emblem">
   <svg viewBox="0 0 80 80" fill="none" aria-hidden="true">
    <path
        d="M46 5 L19 43 H36 L29 75 L62 32 H43 L46 5Z"
        fill="currentColor"
        stroke="#fff0c7"
        stroke-width="2"
        stroke-linejoin="round"
    />
</svg>
          </div>
          <h3>Laxus</h3>
          <div class="role">Leader</div>
          <p class="trait">“Ikaw lang sapat na <3“</p>
        </article>

        <article class="member yvaine">
          <div class="sigil" aria-label="Ice emblem">
            <svg viewBox="0 0 80 80" fill="none" aria-hidden="true">
              <path d="M40 7 V73 M11 23 L69 57 M11 57 L69 23" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
              <path d="M40 7 L32 17 M40 7 L48 17 M40 73 L32 63 M40 73 L48 63 M11 23 L24 24 M11 23 L16 35 M69 57 L56 56 M69 57 L64 45 M11 57 L24 56 M11 57 L16 45 M69 23 L56 24 M69 23 L64 35" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            </svg>
          </div>
          <h3>Heiress Yvaine</h3>
          <div class="role">Co-Leader</div>
          <p class="trait">“Gwapo kaba?“</p>
        </article>

        <article class="member scorpio">
          <div class="sigil" aria-label="Flame emblem">
            <svg viewBox="0 0 80 80" fill="none" aria-hidden="true">
              <path d="M42 6 C46 22 28 26 32 41 C24 37 23 31 25 25 C12 38 14 57 28 67 C42 78 62 68 64 52 C66 39 56 29 53 22 C52 35 46 37 43 34 C38 29 48 17 42 6Z" fill="currentColor"/>
              <path d="M42 43 C45 52 36 54 39 63 C30 61 29 52 34 47 C35 54 40 53 42 43Z" fill="#fff0c7"/>
            </svg>
          </div>
          <h3>Scorpio_05</h3>
          <div class="role">Co-Leader</div>
          <p class="trait">“Fonso For life!“</p>
        </article>
      </div>
    </section>

    <footer><h2>Join us and be part of Fairy Tail • Guild ID #2QUP899CJ</h2></footer>
  </main>
</body>
</html>
